services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped

    depends_on:
      document-worker:
        condition: service_started
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_TASK_REQUEST_TIMEOUT: "240"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0

      N8N_HOST: ${DOMAIN_NAME}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://${DOMAIN_NAME}
      WEBHOOK_URL: https://${DOMAIN_NAME}/
      N8N_PROXY_HOPS: 1

      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336

      NODES_EXCLUDE: "[]"

    volumes:
      - n8n_data:/home/node/.n8n
      - ../document-pipeline:/home/node/.n8n-files/document-pipeline:ro

  task-runners:
    image: n8nio/runners:2.30.7
    restart: unless-stopped

    depends_on:
      - n8n

    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}

    volumes:
      - type: bind
        source: ./n8n-task-runners.json
        target: /etc/n8n-task-runners.json
        read_only: true

  document-worker:
    build:
      context: ../document-worker
      dockerfile: Dockerfile
    container_name: document-worker
    restart: unless-stopped
    volumes:
      - ../document-pipeline:/data/document-pipeline

volumes:
  postgres_data:
  n8n_data:
